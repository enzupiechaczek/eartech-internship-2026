{% extends "base.html" %}

{% block title %}Access denied | HealthPulse{% endblock %}

{% block content %}
<div class="hp-card text-center mx-auto py-5" style="max-width: 560px;">
    <p class="hp-eyebrow">Error 403</p>
    <h1>Access denied</h1>
    <p class="text-muted">
        {% if exception %}{{ exception }}{% else %}You don't have permission to view this page.{% endif %}
    </p>
    <a href="{% url 'home' %}" class="btn btn-primary">Back to my dashboard</a>
</div>
{% endblock %}
