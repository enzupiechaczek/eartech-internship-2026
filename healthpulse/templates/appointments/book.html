
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Book an Appointment</h2>

    <p>
        Book an appointment with Dr. {{ doctor.user.get_full_name|default:doctor.user.username }}
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Request Appointment
        </button>
    </form>
</div>
{% endblock %}
