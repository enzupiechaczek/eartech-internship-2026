{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Upload Diagnostic File</h2>

    <p>Patient: {{ patient }}</p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Upload</button>
    </form>
</div>
{% endblock %}
