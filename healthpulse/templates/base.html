<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HealthPulse{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark" style="background: #0f6c6c; padding: 1rem;">
        <a class="navbar-brand" href="/" style="color: white; text-decoration: none; font-size: 1.25rem;">
            HealthPulse
        </a>
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}" style="display: inline; float: right;">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
        {% endif %}
    </nav>
    <main class="container" style="padding: 2rem;">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
