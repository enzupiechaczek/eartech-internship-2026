{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Log in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="mt-3">Don't have an account? <a href="#">Register</a> <!-- TODO: Task 3284 will add the real route --></p>
</div>
{% endblock %}
