{% extends "base.html" %}

{% block title %}{{ heading }} | CourseHub{% endblock %}

{% block content %}
    <h1>{{ heading }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-outline-secondary" href="{% url cancel_url cancel_kwargs.course_pk %}">Cancel</a>
    </form>
{% endblock %}
